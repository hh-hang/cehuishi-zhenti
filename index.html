<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101a">
  <meta name="description" content="注册测绘师历年真题与模拟题在线答题、判分和复习">
  <title>注册测绘师在线题库</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101a;
      --bg-deep: #050b12;
      --panel: #0d1824;
      --panel-soft: #101d2b;
      --card: #111f2d;
      --line: #24384d;
      --line-bright: #365673;
      --text: #edf4fb;
      --muted: #95a8ba;
      --blue: #4c91ff;
      --cyan: #59d5f8;
      --amber: #f5b84b;
      --amber-soft: #2c2110;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
      background: var(--bg-deep);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 88% 4%, rgb(37 99 235 / 22%), transparent 29rem),
        radial-gradient(circle at 4% 36%, rgb(14 165 233 / 8%), transparent 24rem),
        linear-gradient(180deg, #07101a 0, #08121c 44%, #060c13 100%);
    }

    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      width: calc(100% - 40px);
      max-width: 1180px;
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      border-bottom: 1px solid rgb(36 56 77 / 78%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: .01em;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid #45698d;
      border-radius: 11px;
      color: #e0efff;
      background: linear-gradient(145deg, rgb(37 99 235 / 55%), rgb(56 189 248 / 14%));
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%);
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .site-nav { display: flex; gap: 7px; }

    .site-nav a {
      padding: 8px 12px;
      border-radius: 9px;
      color: #afbdcb;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
      color: #fff;
      background: rgb(255 255 255 / 6%);
      outline: none;
    }

    .github-link {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 10px;
      color: #b8c7d6;
      background: rgb(13 27 40 / 72%);
      transition: color .18s ease, background .18s ease;
    }

    .github-link svg { width: 20px; height: 20px; fill: currentColor; }

    .github-link:hover {
      color: #fff;
      background: #152536;
    }

    .github-link:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .library { padding: 14px 0 82px; }

    .library-section {
      scroll-margin-top: 18px;
      margin-top: 28px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgb(13 26 38 / 86%), rgb(8 17 26 / 90%));
      box-shadow: 0 16px 45px rgb(0 0 0 / 14%);
    }

    .library-section.mock-library {
      border-color: #4b3b22;
      background: linear-gradient(180deg, rgb(35 27 15 / 68%), rgb(12 17 22 / 92%));
    }

    .library-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .mock-library .library-heading { border-color: #3d3120; }
    .library-title-row { display: flex; align-items: center; gap: 12px; }

    .type-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid #3d67a0;
      border-radius: 12px;
      color: #dcecff;
      background: #15335b;
      font-weight: 900;
    }

    .type-mark.mock { border-color: #7a5b26; color: #ffe3a6; background: #3a2a10; }
    .library-heading h2 { margin: 0 0 6px; font-size: 23px; letter-spacing: -.025em; }
    .library-heading p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .type-count {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #334d67;
      border-radius: 999px;
      color: #a9bfd4;
      font-size: 12px;
    }

    .mock-library .type-count { border-color: #66502a; color: #d2b67e; }
    .subject-group { padding-top: 27px; }
    .subject-group + .subject-group { margin-top: 28px; border-top: 1px solid rgb(36 56 77 / 72%); }
    .mock-library .subject-group + .subject-group { border-color: rgb(73 57 31 / 72%); }

    .subject-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 15px;
    }

    .subject-heading h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .subject-count { color: #7f93a6; font-size: 12px; }
    .exam-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    .exam-card {
      position: relative;
      display: flex;
      min-height: 210px;
      flex-direction: column;
      overflow: hidden;
      padding: 20px;
      border: 1px solid #2d465e;
      border-radius: 16px;
      background: linear-gradient(155deg, #112233, #0c1722);
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .exam-card.mock { border-color: #514126; background: linear-gradient(155deg, #241d12, #111820 72%); }

    .exam-card::after {
      position: absolute;
      right: -48px;
      bottom: -72px;
      width: 160px;
      height: 160px;
      border: 1px solid rgb(76 145 255 / 13%);
      border-radius: 50%;
      content: "";
    }

    .exam-card.mock::after { border-color: rgb(245 184 75 / 13%); }
    .exam-card:hover { border-color: #527ba4; box-shadow: 0 17px 36px rgb(0 0 0 / 23%); transform: translateY(-3px); }
    .exam-card.mock:hover { border-color: #9a7336; }
    .exam-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .card-kind {
      align-self: flex-start;
      margin-bottom: 15px;
      padding: 5px 8px;
      border-radius: 6px;
      color: #94c2ff;
      background: rgb(37 99 235 / 15%);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .exam-card.mock .card-kind { color: #f6cd7b; background: rgb(180 120 24 / 15%); }
    .exam-card h4 { margin: 0 0 8px; font-size: 21px; line-height: 1.35; letter-spacing: -.025em; }
    .exam-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .card-footer {
      display: flex;
      z-index: 1;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 22px;
      color: #a9bbcc;
      font-size: 11px;
    }

    .start-arrow {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: #2467bd;
      font-size: 16px;
      font-weight: 900;
    }

    .exam-card.mock .start-arrow { color: #271a04; background: #e4a93f; }

    .empty-state {
      margin-top: 24px;
      padding: 30px;
      border: 1px dashed #66502c;
      border-radius: 16px;
      text-align: center;
      background: rgb(54 39 15 / 22%);
    }

    .empty-state strong { display: block; margin-bottom: 8px; font-size: 16px; }
    .empty-state p { margin: 0; color: #af9a72; font-size: 13px; line-height: 1.7; }
    .empty-state code { color: #f4cb7b; font-family: Consolas, monospace; }

    .site-footer {
      display: flex;
      gap: 20px;
      justify-content: space-between;
      padding: 27px 0 36px;
      border-top: 1px solid var(--line);
      color: #718598;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .exam-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .page { width: calc(100% - 22px); }
      .site-header { min-height: 64px; }
      .site-nav { display: none; }
      .library { padding-bottom: 58px; }
      .library-section { margin-top: 18px; padding: 19px 15px; border-radius: 19px; }
      .library-heading { flex-direction: column; gap: 14px; }
      .exam-grid { grid-template-columns: 1fr; }
      .exam-card { min-height: 195px; }
      .site-footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .exam-card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="注册测绘师在线题库首页">
        <span class="brand-mark" aria-hidden="true">测</span>
        <span>注册测绘师在线题库</span>
      </a>
      <div class="header-actions">
        <nav class="site-nav" aria-label="题库分类">
          <a href="#real-exams">历年真题</a>
          <a href="#mock-exams">模拟题</a>
        </nav>
        <a class="github-link" href="https://github.com/hh-hang/cehuishi-zhenti" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看本项目" title="GitHub 仓库">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8a8.003 8.003 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.58c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
        </a>
      </div>
    </header>

    <main>
      <section class="library" aria-label="试卷目录">
        <section id="real-exams" class="library-section" aria-labelledby="real-title">
          <div class="library-heading">
            <div class="library-title-row">
              <span class="type-mark" aria-hidden="true">真</span>
              <div><h2 id="real-title">历年真题</h2><p>按年份回顾真实考试题型与知识点分布。</p></div>
            </div>
            <span id="realCount" class="type-count">正在读取…</span>
          </div>
          <div id="realCatalog" class="subject-catalog">
            <section class="subject-group">
              <div class="subject-heading"><h3>测绘综合能力</h3><span class="subject-count">1 套</span></div>
              <div class="exam-grid">
                <a class="exam-card" href="exams/测绘综合能力-2025.html" data-exam-file="测绘综合能力-2025.html">
                  <span class="card-kind">历年真题</span>
                  <h4>2025 年真题</h4>
                  <p>测绘综合能力 · 在线答题与练习</p>
                  <span class="card-footer"><span>自动判分 · 逐题解析</span><b class="start-arrow" aria-hidden="true">→</b></span>
                </a>
              </div>
            </section>
          </div>
        </section>

        <section id="mock-exams" class="library-section mock-library" aria-labelledby="mock-title">
          <div class="library-heading">
            <div class="library-title-row">
              <span class="type-mark mock" aria-hidden="true">模</span>
              <div><h2 id="mock-title">模拟题专区</h2><p>贴近考试节奏的整卷训练，完成后集中复盘。</p></div>
            </div>
            <span id="mockCount" class="type-count">待添加</span>
          </div>
          <div id="mockCatalog" class="subject-catalog">
            <div class="empty-state">
              <strong>模拟题正在整理中</strong>
              <p>将试卷放入 exams 目录，推荐命名为 <code>科目-模拟题-01.html</code>，首页会自动收录。</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <span>本项目用于个人学习与交流。</span>
      <span>真题、模拟题答案及解析均仅供参考。</span>
    </footer>
  </div>

  <script src="exams/catalog.js"></script>
  <script>
    const subjects = ["测绘综合能力", "测绘管理与法律法规", "测绘案例分析"];
    const subjectOrder = new Map(subjects.map((subject, index) => [subject, index]));
    const realPattern = /^((?:19|20)\d{2})$/u;
    const realCatalog = document.getElementById("realCatalog");
    const mockCatalog = document.getElementById("mockCatalog");
    const realCount = document.getElementById("realCount");
    const mockCount = document.getElementById("mockCount");
    const generatedFiles = Array.isArray(window.CEHUISHI_EXAMS) ? window.CEHUISHI_EXAMS : [];
    const fallbackFiles = [...new Set([
      ...generatedFiles,
      ...[...document.querySelectorAll("[data-exam-file]")].map(element => element.dataset.examFile)
    ])];

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }

    function parseExamFile(name) {
      if (typeof name !== "string" || !name.toLowerCase().endsWith(".html")) return null;
      const subject = subjects.find(item => name.startsWith(`${item}-`));
      if (!subject) return null;

      const suffix = name.slice(subject.length + 1, -5);
      const realMatch = suffix.match(realPattern);
      if (realMatch) {
        const year = Number(realMatch[1]);
        return { name, subject, kind: "real", year, title: `${year} 年真题` };
      }

      if (!suffix.includes("模拟")) return null;
      const normalizedTitle = suffix
        .replace(/[-_]+/gu, " ")
        .replace(/^模拟(?:题)?/u, "模拟题")
        .replace(/\s+/gu, " ")
        .trim();
      return { name, subject, kind: "mock", year: 0, title: normalizedTitle || "模拟题" };
    }

    function parseExamFiles(fileNames) {
      return [...new Set(fileNames)]
        .map(parseExamFile)
        .filter(Boolean)
        .sort((a, b) => {
          const subjectDifference = subjectOrder.get(a.subject) - subjectOrder.get(b.subject);
          if (subjectDifference) return subjectDifference;
          if (a.kind === "real" && b.kind === "real") return b.year - a.year;
          return a.title.localeCompare(b.title, "zh-CN", { numeric: true });
        });
    }

    function renderCard(exam) {
      const subject = escapeHtml(exam.subject);
      const title = escapeHtml(exam.title);
      const href = `exams/${encodeURIComponent(exam.name)}`;
      const isMock = exam.kind === "mock";
      return `<a class="exam-card${isMock ? " mock" : ""}" href="${href}" data-exam-file="${escapeHtml(exam.name)}">
        <span class="card-kind">${isMock ? "模拟练习" : "历年真题"}</span>
        <h4>${title}</h4>
        <p>${subject} · 在线答题与练习</p>
        <span class="card-footer"><span>自动判分 · 逐题解析</span><b class="start-arrow" aria-hidden="true">→</b></span>
      </a>`;
    }

    function renderCatalog(exams, kind) {
      const catalog = kind === "real" ? realCatalog : mockCatalog;
      const matchingExams = exams.filter(exam => exam.kind === kind);
      if (!matchingExams.length) {
        catalog.innerHTML = kind === "mock"
          ? `<div class="empty-state"><strong>模拟题正在整理中</strong><p>将试卷放入 exams 目录，推荐命名为 <code>科目-模拟题-01.html</code>，首页会自动收录。</p></div>`
          : `<div class="empty-state"><strong>暂无已收录真题</strong><p>真题文件请使用 <code>科目-年份.html</code> 的命名格式。</p></div>`;
        return;
      }

      catalog.innerHTML = subjects.map((subjectName, subjectIndex) => {
        const subjectExams = matchingExams.filter(exam => exam.subject === subjectName);
        if (!subjectExams.length) return "";
        return `<section class="subject-group" aria-labelledby="${kind}-subject-${subjectIndex}">
          <div class="subject-heading">
            <h3 id="${kind}-subject-${subjectIndex}">${escapeHtml(subjectName)}</h3>
            <span class="subject-count">${subjectExams.length} 套</span>
          </div>
          <div class="exam-grid">${subjectExams.map(renderCard).join("")}</div>
        </section>`;
      }).join("");
    }

    function renderExamFiles(exams) {
      const realExams = exams.filter(exam => exam.kind === "real");
      const mockExams = exams.filter(exam => exam.kind === "mock");
      realCount.textContent = `已收录 ${realExams.length} 套`;
      mockCount.textContent = mockExams.length ? `已收录 ${mockExams.length} 套` : "待添加";
      renderCatalog(exams, "real");
      renderCatalog(exams, "mock");
    }

    async function readLocalDirectory() {
      const directoryUrl = new URL("exams/", window.location.href);
      const response = await fetch(directoryUrl, { cache: "no-store" });
      if (!response.ok) throw new Error("无法读取本地题库目录");
      const directoryHtml = await response.text();
      const directoryDocument = new DOMParser().parseFromString(directoryHtml, "text/html");
      return [...directoryDocument.querySelectorAll("a[href]")].map(link => {
        try {
          const url = new URL(link.getAttribute("href"), directoryUrl);
          return decodeURIComponent(url.pathname.split("/").filter(Boolean).pop() || "");
        } catch { return ""; }
      });
    }

    async function readGitHubPagesDirectory() {
      const hostMatch = window.location.hostname.match(/^([^.]+)\.github\.io$/i);
      if (!hostMatch) return [];
      const owner = hostMatch[1];
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const repository = pathParts[0] || `${owner}.github.io`;
      const endpoint = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repository)}/contents/exams`;
      const response = await fetch(endpoint, {
        headers: { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }
      });
      if (!response.ok) throw new Error("无法读取 GitHub 题库目录");
      const files = await response.json();
      return Array.isArray(files) ? files.filter(file => file.type === "file").map(file => file.name) : [];
    }

    async function discoverExams() {
      let fileNames = [];
      try {
        fileNames = window.location.hostname.endsWith(".github.io")
          ? await readGitHubPagesDirectory()
          : await readLocalDirectory();
      } catch { fileNames = fallbackFiles; }
      renderExamFiles(parseExamFiles([...fallbackFiles, ...fileNames]));
    }

    renderExamFiles(parseExamFiles(fallbackFiles));
    discoverExams();
  </script>
</body>
</html>
