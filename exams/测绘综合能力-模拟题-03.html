const pageSize=10,totalPages=Math.ceil(qs.length/pageSize);
let currentPage=0,submitted=false;
const quizId='chs2026-final-predict-100-v1';

function load(){
 let s=null; try{s=JSON.parse(localStorage.getItem(quizId)||'null')}catch(e){}
 if(!s) s={answers:Array(qs.length).fill(null).map(()=>[]),guesses:Array(qs.length).fill(false),currentPage:0,submitted:false};
 currentPage=s.currentPage||0; submitted=!!s.submitted;
 return s;
}
let state=load();

function save(){
 state.currentPage=currentPage; state.submitted=submitted;
 try{localStorage.setItem(quizId,JSON.stringify(state))}catch(e){}
}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function calc(){
 let score=0,exact=0,guessed=0,unanswered=0,details=[];
 qs.forEach((q,i)=>{
   let a=state.answers[i]||[], c=q.a, ok=sameSet(a,c), pts=0;
   if(!a.length) unanswered++;
   if(state.guesses[i]) guessed++;
   if(q.t==='s') pts=ok?1:0;
   else{ const wrong=a.some(x=>!c.includes(x)); if(wrong)pts=0; else if(ok)pts=2; else pts=a.length*0.5; }
   if(ok&&a.length) exact++;
   score+=pts; details.push({i:i+1,a:a.join('')||'-',c:c.join(''),ok,pts,g:!!state.guesses[i],topic:q.topic});
 });
 return {score,exact,guessed,unanswered,details};
}
function updateTop(){
 const n=state.answers.filter(a=>a&&a.length).length;
 document.getElementById('ptxt').textContent=`已作答 ${n} / 100`;
 document.getElementById('pbar').style.width=(n/100*100)+'%';
 document.getElementById('scoretop').textContent=submitted?`已交卷：${calc().score.toFixed(1)} / 120`:'未交卷';
}
function render(){
 const box=document.getElementById('quiz'); box.innerHTML='';
 const start=currentPage*pageSize,end=Math.min(qs.length,start+pageSize);
 for(let i=start;i<end;i++){ const q=qs[i], div=document.createElement('section'); div.className='q';
   if(submitted) div.classList.add(sameSet(state.answers[i]||[],q.a)?'correct':'wrong');
   const inputType=q.t==='s'?'radio':'checkbox';
   div.innerHTML=`<div class="qhead"><div class="qt">${i+1}. ${q.q}</div><span class="topic">${q.topic}｜${q.t==='s'?'单选':'多选'}</span></div>
   <div class="opts">${q.o.map(opt=>{let key=opt[0],checked=(state.answers[i]||[]).includes(key)?'checked':'';return `<label class="opt"><input type="${inputType}" name="q${i}" value="${key}" ${checked} ${submitted?'disabled':''} onchange="pick(${i},'${key}',this.checked)"><span>${opt}</span></label>`}).join('')}</div>
   <label class="unsure"><input type="checkbox" ${state.guesses[i]?'checked':''} ${submitted?'disabled':''} onchange="guess(${i},this.checked)"> 不确定 / 蒙</label>
   <div class="explain" style="${submitted?'display:block':''}"><b>${sameSet(state.answers[i]||[],q.a)?'✓ 正确':'✗ 参考答案 '+q.a.join('')}</b><br>${q.e}</div>`;
   box.appendChild(div);
 }
 document.getElementById('pageinfo').textContent=`第 ${currentPage+1} / ${totalPages} 页（${start+1}—${end}题）`;
 renderNav();updateTop();save();
}
function pick(i,key,checked){
 let a=state.answers[i]||[];
 if(qs[i].t==='s') a=checked?[key]:[];
 else{ if(checked&&!a.includes(key))a.push(key); if(!checked)a=a.filter(x=>x!==key); a.sort(); }
 state.answers[i]=a; updateTop();renderNav();save();
}
function guess(i,v){state.guesses[i]=v;renderNav();save();}
function prevPage(){if(currentPage>0){currentPage--;render();window.scrollTo({top:0,behavior:'smooth'})}}
function nextPage(){if(currentPage<totalPages-1){currentPage++;render();window.scrollTo({top:0,behavior:'smooth'})}}
function gotoQ(i){currentPage=Math.floor(i/pageSize);render();setTimeout(()=>document.querySelectorAll('.q')[i%pageSize]?.scrollIntoView({behavior:'smooth',block:'start'}),80)}
function renderNav(){
 const r=submitted?calc():null; const nav=document.getElementById('nav');
 nav.innerHTML=qs.map((q,i)=>{let cls=[];if((state.answers[i]||[]).length)cls.push('answered');if(state.guesses[i])cls.push('guess');if(submitted)cls.push(r.details[i].ok?'ok':'bad');return `<button class="${cls.join(' ')}" onclick="gotoQ(${i})">${i+1}</button>`}).join('');
}
function buildText(){
 const r=calc(); let s=`【2026注册测绘师｜测绘综合能力考前最终押题卷】\n得分：${r.score.toFixed(1)}/120\n完整答对：${r.exact}/100\n不确定/蒙：${r.guessed}\n未作答：${r.unanswered}\n\n逐题结果：\n`;
 r.details.forEach(x=>s+=`${x.i}. ${x.a}${x.g?'【不确定/蒙】':''}｜${x.ok?'对':(x.pts>0?'少选':'错')}｜参考答案 ${x.c}｜${x.topic}\n`);
 return s;
}
function submitQuiz(){
 if(submitted) return;
